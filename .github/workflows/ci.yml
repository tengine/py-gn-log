name: CI

on:
    push:
        branches:
            - "**"

jobs:
    ci:
        name: CI (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest

        strategy:
            # 片方の版で失敗しても、もう片方の版の結果も見られるようにする
            fail-fast: false
            matrix:
                # ファイル .python-version の版と、その次の版
                python-version: ["3.13", "3.14"]

        env:
            # uv sync と uv run (Makefile の uv run を含む) が使う Python の版。
            # ファイル .python-version より優先される。無いと、uv run が .python-version の版で
            # venv を作り直す
            UV_PYTHON: ${{ matrix.python-version }}

        steps:
            # https://github.com/actions/checkout
            - uses: actions/checkout@v5

            # https://docs.astral.sh/uv/guides/integration/github/
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true

            - name: Set up Python
              run: uv python install ${{ matrix.python-version }}

            - name: Install the project
              run: uv sync --locked --all-extras --dev

            - run: make check
            - run: make lint
            - run: make format git-check

            - run: make test-cov
            - name: Archive htmlcov
              uses: actions/upload-artifact@v4
              with:
                  # 版ごとに名前を分ける (matrix の job が同じ名前の artifact に
                  # アップロードすると、衝突してエラーになる)
                  name: htmlcov-${{ matrix.python-version }}
                  path: htmlcov/
